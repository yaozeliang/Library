{% extends "layouts/base-fullscreen.html" %}

{% block document_title %}Open Library{% endblock %}
{% block title %}Open Library{% endblock %}

{% block content %}   

    <div class="auth-wrapper">
        <div class="auth-content">
            <div class="auth-bg">
                <span class="r"></span>
                <span class="r s"></span>
                <span class="r s"></span>
                <span class="r"></span>
            </div>
            <div class="card">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="feather icon-unlock auth-icon"></i>
                    </div>
                    <h1 class="library-auth-title">Open Library</h1>
                    <p class="h5 mb-4">Login</p>

                    <span class="mb-0 text-muted">
                        Add your credentials
                    </span>

                    <br />
                    <br />
                    
                    <form role="form" action="/">

                        <div class="input-group mb-3">
                            <label class="sr-only" for="login-username">Username</label>
                            <input id="login-username" class="form-control" placeholder="Username" aria-label="Username">
                        </div>
                        
                        <div class="input-group mb-4">
                            <label class="sr-only" for="login-password">Password</label>
                            <input id="login-password" type="password" class="form-control" placeholder="password" aria-label="password">
                        </div>

                        <button name="login" class="btn btn-primary shadow-2 mb-4">Login</button>

                    </form>

                    <p class="mb-0 text-muted">Don’t have an account? <a href="/register.html" >Signup</a></p>
                    <br />
                    <p class="mb-2 text-muted">
                        Made with ❤️ by <a href="https://www.hephaestus.fr" target="_blank" rel="noopener">Hephaestus</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

{% endblock content %}
