name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.8'
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_library
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev
        npm install

    - name: Create environment file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-github-actions
        DEBUG=True
        DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_library
        EOF

    - name: Run Django system checks
      run: |
        uv run python manage.py check

    - name: Run migrations
      run: |
        uv run python manage.py migrate

    - name: Collect static files
      run: |
        uv run python manage.py collectstatic --noinput

    - name: Run Django tests
      run: |
        uv run python manage.py test





  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev



    - name: Run bandit security linter
      run: |
        uv run pip install bandit
        uv run bandit -r . -x ./env/,./venv/,./.venv/,./tests/

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Build and push Docker image to GCR
      run: |
        IMAGE_NAME="gcr.io/${{ secrets.GCP_PROJECT_ID }}/django-library"
        docker build -t $IMAGE_NAME:$GITHUB_SHA .
        docker push $IMAGE_NAME:$GITHUB_SHA
        docker tag $IMAGE_NAME:$GITHUB_SHA $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy django-library \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/django-library:$GITHUB_SHA \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --set-env-vars="SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" \
          --set-env-vars="DEBUG=False" \
          --set-env-vars="GS_BUCKET_NAME=${{ secrets.GS_BUCKET_NAME }}" \
          --set-env-vars="GS_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
          --set-env-vars="DJANGO_SETTINGS_MODULE=core.settings_production" \
          --set-env-vars="ALLOWED_HOSTS=*.run.app,localhost,127.0.0.1" \
          --memory=512Mi \
          --cpu=1 \
          --max-instances=10 \
          --quiet

    - name: Get Cloud Run URL
      run: |
        SERVICE_URL=$(gcloud run services describe django-library --platform managed --region us-central1 --format 'value(status.url)')
        echo "🚀 Application deployed successfully!"
        echo "📱 URL: $SERVICE_URL"