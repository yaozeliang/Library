[project]
name = "library-management"
version = "1.0.0"
description = "Django Library Management System"
authors = [
    {name = "Library Team", email = "team@library.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleach[css]>=6.2",
    "crispy-bootstrap4>=2024.10",
    "crispy-tailwind>=1.0",
    "dj-database-url>=2.3",
    "Django>=5.2,<5.3",
    "django-bootstrap4>=26.1",
    "django-bootstrap-datepicker-plus>=5.0",
    "django-ckeditor>=6.7",
    "django-crispy-forms>=2.3",
    "django-flatpickr>=2.0",
    "django-mptt>=0.16",
    "django-notifications-hq @ git+https://github.com/django-notifications/django-notifications.git@4c44bcea2504d9a3fcd26366b232a13732a08f2a",
    "django-phonenumber-field>=8.0",
    "django-storages[google]>=1.14",
    "djangorestframework>=3.16",
    "pandas>=2.2",
    "Pillow>=11",
    "psycopg2-binary>=2.9",
    "python-dateutil>=2.9",
    "python-decouple>=3.8",
    "requests>=2.32",
    "whitenoise>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "safety>=2.0.0",
    "bandit>=1.7.0",
]
production = [
    "gunicorn>=23.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "sentry-sdk>=2.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "Api",
    "authentication",
    "book",
    "comment",
    "core"
] 
